<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="820" fill="url(#bg3)"/>

  <text x="60" y="55" fill="#f1f5f9" font-size="24" font-weight="700">设置与记忆面板 · 真实模块对照</text>
  <text x="60" y="80" fill="#94a3b8" font-size="13">左侧：设置窗口（Provider / Keychain / 快捷键 / 语言 / 自启 / 更新）；右侧：本地记忆与加密存储</text>

  <!-- 左：设置面板 -->
  <g transform="translate(60,120)">
    <rect width="520" height="640" rx="16" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
    <rect width="520" height="44" rx="16" fill="#1e293b"/>
    <text x="20" y="28" fill="#f1f5f9" font-size="15" font-weight="700">设置 · Settings</text>
    <text x="490" y="28" text-anchor="end" fill="#64748b" font-size="11">settings window</text>

    <!-- Provider 行 -->
    <g transform="translate(20,70)">
      <rect width="480" height="80" rx="10" fill="#1e293b"/>
      <text x="16" y="26" fill="#7dd3fc" font-size="13" font-weight="600">LLM Provider</text>
      <text x="16" y="50" fill="#cbd5e1" font-size="12">OpenAI / Anthropic / Gemini / DeepSeek / Ollama…</text>
      <text x="16" y="70" fill="#64748b" font-size="11">Key 写入系统 Keychain（keychain.rs），不写仓库</text>
    </g>

    <!-- 快捷键 -->
    <g transform="translate(20,160)">
      <rect width="480" height="60" rx="10" fill="#1e293b"/>
      <text x="16" y="26" fill="#7dd3fc" font-size="13" font-weight="600">全局快捷键</text>
      <text x="16" y="48" fill="#cbd5e1" font-size="12">Ctrl+Shift+P 切换宠物显隐（plugin-global-shortcut）</text>
    </g>

    <!-- 语言 -->
    <g transform="translate(20,230)">
      <rect width="480" height="60" rx="10" fill="#1e293b"/>
      <text x="16" y="26" fill="#7dd3fc" font-size="13" font-weight="600">界面语言</text>
      <text x="16" y="48" fill="#cbd5e1" font-size="12">简体中文 · English · 日本語 · 한국어 · 繁體中文（i18next）</text>
    </g>

    <!-- 自启 / 更新 -->
    <g transform="translate(20,300)">
      <rect width="235" height="70" rx="10" fill="#1e293b"/>
      <text x="16" y="26" fill="#7dd3fc" font-size="13" font-weight="600">开机自启</text>
      <text x="16" y="50" fill="#cbd5e1" font-size="11">plugin-autostart</text>
      <rect x="245" width="235" height="70" rx="10" fill="#1e293b"/>
      <text x="261" y="26" fill="#7dd3fc" font-size="13" font-weight="600">增量更新</text>
      <text x="261" y="50" fill="#cbd5e1" font-size="11">plugin-updater · updates.json</text>
    </g>

    <!-- MCP 设置 -->
    <g transform="translate(20,380)">
      <rect width="480" height="70" rx="10" fill="#1e293b"/>
      <text x="16" y="26" fill="#fbbf24" font-size="13" font-weight="600">MCP 设置 · McpSettingsPanel.tsx</text>
      <text x="16" y="50" fill="#cbd5e1" font-size="11">spiritpal-mcp sidecar 开关 · 外部 MCP 客户端接入</text>
    </g>

    <!-- Live2D -->
    <g transform="translate(20,460)">
      <rect width="480" height="80" rx="10" fill="#1e293b"/>
      <text x="16" y="26" fill="#34d399" font-size="13" font-weight="600">Live2D（可选，不随包分发）</text>
      <text x="16" y="50" fill="#cbd5e1" font-size="11">将 live2dcubismcore.js 放入应用数据目录后自动启用</text>
      <text x="16" y="70" fill="#64748b" font-size="11">合规：docs/COMPLIANCE_CHECKLIST.md · docs/LIVE2D_*.md</text>
    </g>

    <!-- 崩溃自启开关 -->
    <g transform="translate(20,550)">
      <rect width="480" height="70" rx="10" fill="#1e293b"/>
      <text x="16" y="26" fill="#f87171" font-size="13" font-weight="600">崩溃自启 / 诊断</text>
      <text x="16" y="50" fill="#cbd5e1" font-size="11">SPIRITPAL_DISABLE_CRASH_RESTART=1 可关闭</text>
      <text x="16" y="68" fill="#64748b" font-size="11">crash_YYYYMMDD_HHMMSS.log · audit_log.rs · diagnostics.rs</text>
    </g>
  </g>

  <!-- 右：记忆面板 -->
  <g transform="translate(620,120)">
    <rect width="520" height="640" rx="16" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
    <rect width="520" height="44" rx="16" fill="#1e293b"/>
    <text x="20" y="28" fill="#f1f5f9" font-size="15" font-weight="700">记忆 · MemoryPanel.tsx</text>
    <text x="500" y="28" text-anchor="end" fill="#64748b" font-size="11">本地优先</text>

    <!-- 对话条目 -->
    <g transform="translate(20,70)">
      <rect width="480" height="90" rx="10" fill="#1e293b"/>
      <text x="16" y="26" fill="#34d399" font-size="13" font-weight="600">已记住的对话片段</text>
      <text x="16" y="50" fill="#cbd5e1" font-size="12">「用户喜欢早上喝美式，下午容易犯困」</text>
      <text x="16" y="72" fill="#64748b" font-size="11">MemoryVisualizer.tsx · MemoryVisualization.tsx</text>
    </g>

    <!-- Embedding -->
    <g transform="translate(20,170)">
      <rect width="480" height="90" rx="10" fill="#1e293b"/>
      <text x="16" y="26" fill="#34d399" font-size="13" font-weight="600">Embedding 向量（本地推理）</text>
      <text x="16" y="50" fill="#cbd5e1" font-size="12">@xenova/transformers · 浏览器端/侧车运行</text>
      <text x="16" y="72" fill="#64748b" font-size="11">memory_sidecar/（Rust）· 相似度检索</text>
    </g>

    <!-- 加密存储 -->
    <g transform="translate(20,270)">
      <rect width="480" height="110" rx="10" fill="#1e293b"/>
      <text x="16" y="26" fill="#f87171" font-size="13" font-weight="600">加密落盘（encrypted_db.rs）</text>
      <text x="16" y="50" fill="#cbd5e1" font-size="12">AES-256-GCM · PBKDF2 派生密钥 · SHA-256 校验</text>
      <text x="16" y="72" fill="#cbd5e1" font-size="12">sqlite.rs · 数据仅存在本机应用数据目录</text>
      <text x="16" y="94" fill="#64748b" font-size="11">不上传云端 · 隐私政策：docs/PRIVACY_POLICY.md</text>
    </g>

    <!-- 端侧模型 -->
    <g transform="translate(20,390)">
      <rect width="480" height="90" rx="10" fill="#1e293b"/>
      <text x="16" y="26" fill="#c084fc" font-size="13" font-weight="600">端侧模型 · OnDeviceModelPanel.tsx</text>
      <text x="16" y="50" fill="#cbd5e1" font-size="12">src-tauri/src/ondevice/ · 设备分档与串行调度</text>
      <text x="16" y="72" fill="#64748b" font-size="11">不内置模型权重 · 用户自行导入 .petmod</text>
    </g>

    <!-- 数据面板 -->
    <g transform="translate(20,490)">
      <rect width="480" height="130" rx="10" fill="#1e293b"/>
      <text x="16" y="26" fill="#7dd3fc" font-size="13" font-weight="600">数据与导入导出</text>
      <text x="16" y="52" fill="#cbd5e1" font-size="12">DataPanel.tsx · character_import.rs · petmod.rs（zip）</text>
      <text x="16" y="76" fill="#cbd5e1" font-size="12">character-packs/ 示例角色 · CharacterImportWizard.tsx</text>
      <text x="16" y="100" fill="#64748b" font-size="11">asset_pipeline.rs · integrity.rs · magic_check.rs</text>
    </g>
  </g>

  <text x="60" y="795" fill="#64748b" font-size="11">所有设置项均对应仓库真实源码文件，未编造功能</text>
</svg>
