# Structure-guard pre-commit config (auto-generated bootstrap).
# Install: pip install pre-commit && pre-commit install
# Run all: pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: structure-guard
        name: Structure Guard (root layout)
        entry: python .github/scripts/check_layout.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
      # P2-1: capability 最小授权 lint（报告2 §二）
      - id: capability-lint
        name: Capability Lint (minimal permissions)
        entry: node scripts/lint-capabilities.mjs
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
