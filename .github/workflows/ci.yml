name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    name: Lint and Test (Frontend, Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint (type check + ESLint)
        run: pnpm lint

      - name: Run frontend tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 14

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm and Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start dev server
        run: |
          pnpm dev > /dev/null 2>&1 &
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:5223 > /dev/null 2>&1 && break
            sleep 1
          done
          curl -s http://127.0.0.1:5223 > /dev/null 2>&1 || (echo "Dev server failed to start" && exit 1)
      
      - name: Wait for app ready
        run: sleep 10

      - name: Run core E2E tests
        run: pnpm exec playwright test tests/e2e/app-loading.spec.ts tests/e2e/pet-interaction.spec.ts
        continue-on-error: true

      - name: Run accessibility tests
        run: pnpm exec playwright test tests/e2e/accessibility.spec.ts
        continue-on-error: true

      - name: Run system tests
        run: pnpm exec playwright test tests/e2e/memory-system.spec.ts tests/e2e/inventory-system.spec.ts
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test videos (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos
          path: test-results/screenshots/video/*.webm
          retention-days: 7

  perf-baseline:
    name: Performance Baseline Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: spiritpal-build-ubuntu-22.04
          path: src-tauri/target/release/

      - name: Setup pnpm and Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run cold-start test
        run: node perf/cold-start.mjs
        env:
          SPIRITPAL_EXE: ./src-tauri/target/release/spiritpal-app
        continue-on-error: true

      - name: Run memory-usage test
        run: node perf/memory-usage.mjs
        env:
          SPIRITPAL_EXE: ./src-tauri/target/release/spiritpal-app
        continue-on-error: true

      - name: Run FPS test
        run: node perf/fps-test.mjs
        env:
          SPIRITPAL_EXE: ./src-tauri/target/release/spiritpal-app
        continue-on-error: true

      - name: Run model-switch-latency test
        run: node perf/model-switch-latency.mjs
        env:
          SPIRITPAL_EXE: ./src-tauri/target/release/spiritpal-app
        continue-on-error: true

      - name: Generate benchmark report
        run: node perf/benchmark-report.mjs
        continue-on-error: true

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-baseline-results
          path: |
            perf/results/
            perf/benchmark-report.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload benchmark report summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-summary
          path: perf/benchmark-report.md
          retention-days: 30

  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Run cargo test with coverage
        run: cargo tarpaulin --workspace --out lcov --output-dir coverage/ --fail-under 50 -- --test-threads=2

      - name: Run cargo clippy
        run: cargo clippy -- -D warnings

      - name: Run cargo fmt check
        run: cargo fmt --check

      - name: Upload Rust coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./src-tauri/coverage/lcov.info
          flags: rust
          name: rust-coverage
          fail_ci_if_error: false

  dependency-vuln-scan:
    name: Dependency Vuln Scan
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: pnpm audit --audit-level=high

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.0
        with:
          scan-args: |-
            --recursive
            --skip-git
            ./

      - name: Upload osv-scanner report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osv-scanner-report
          path: |
            osv-report.json
            osv-report.html
          if-no-files-found: ignore
          retention-days: 14

  secret-scan:
    name: Secret Scanning (Trivy FS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (含完整历史)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy secret scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          scanners: 'secret'
          scan-ref: '.'

  perf-stress:
    name: Performance Stress Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start dev server
        run: |
          pnpm dev > /dev/null 2>&1 &
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:5223 > /dev/null 2>&1 && break
            sleep 1
          done
          curl -s http://127.0.0.1:5223 > /dev/null 2>&1 || (echo "Dev server failed to start" && exit 1)

      - name: Run memory leak test
        run: node perf/memory-leak-test.mjs
        continue-on-error: true

      - name: Run stress test
        run: node perf/stress-test.mjs
        continue-on-error: true

      - name: Upload performance stress results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-stress-results
          path: perf/results/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build (${{ matrix.platform }})
    needs: [lint-and-test, rust-test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spiritpal-build-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/release/*.exe
            src-tauri/target/release/*.msi
          if-no-files-found: ignore
          retention-days: 14
