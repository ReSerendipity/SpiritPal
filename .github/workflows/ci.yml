name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  # 每周一 03:00 UTC 定期跑非门禁类工具链（flaky-detect / mutation / memory-recall）
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and Test (Frontend, Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        # Node 20 已移除：仓库使用 pnpm 11（lockfile 与 pnpm/action-setup 均锁 11），
        # 而 pnpm 11 要求 Node >= 22.13 —— Node 20 上 `Install Node.js` 后 pnpm 直接
        # 报 `This version of pnpm requires at least Node.js v22.13` 并退出，
        # 该矩阵项结构性不可能通过（且 Node 20 已 EOL）。
        node-version: [22]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint (type check + ESLint)
        run: pnpm lint

      - name: Run frontend tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        # 双矩阵（Node 20/22）仅由 Node 22 上传一次，避免同 flag 互相覆盖
        if: always() && matrix.node-version == '22'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 14

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start dev server
        run: |
          pnpm dev > /dev/null 2>&1 &
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:5223 > /dev/null 2>&1 && break
            sleep 1
          done
          curl -s http://127.0.0.1:5223 > /dev/null 2>&1 || (echo "Dev server failed to start" && exit 1)
      
      - name: Wait for app ready
        run: sleep 10

      - name: Run core E2E tests
        run: pnpm exec playwright test tests/e2e/app-loading.spec.ts tests/e2e/pet-interaction.spec.ts

      - name: Run accessibility tests
        run: pnpm exec playwright test tests/e2e/accessibility.spec.ts

      - name: Run system tests
        run: pnpm exec playwright test tests/e2e/memory-system.spec.ts tests/e2e/inventory-system.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test videos (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos
          path: test-results/screenshots/video/*.webm
          retention-days: 7

  perf-baseline:
    if: github.event_name == 'workflow_dispatch'
    name: Performance Baseline Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: spiritpal-build-ubuntu-22.04
          path: src-tauri/target/release/

      - name: Setup pnpm and Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run cold-start test
        run: node perf/cold-start.mjs
        env:
          SPIRITPAL_EXE: ./src-tauri/target/release/spiritpal-app
        continue-on-error: true

      - name: Run memory-usage test
        run: node perf/memory-usage.mjs
        env:
          SPIRITPAL_EXE: ./src-tauri/target/release/spiritpal-app
        continue-on-error: true

      - name: Run FPS test
        run: node perf/fps-test.mjs
        env:
          SPIRITPAL_EXE: ./src-tauri/target/release/spiritpal-app
        continue-on-error: true

      - name: Run model-switch-latency test
        run: node perf/model-switch-latency.mjs
        env:
          SPIRITPAL_EXE: ./src-tauri/target/release/spiritpal-app
        continue-on-error: true

      - name: Generate benchmark report
        run: node perf/benchmark-report.mjs
        continue-on-error: true

      # S5 硬门禁：对已入库基线做回归检查（perf/results/baseline.json），超 20% 回归即红。
      # 数据采集步骤容忍环境噪声（continue-on-error），本步骤不作宽限——性能基线下落必须有人过问。
      - name: Baseline regression gate
        run: node perf/baseline-trend.mjs --read-only
        env:
          SPIRITPAL_EXE: ./src-tauri/target/release/spiritpal-app

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-baseline-results
          path: |
            perf/results/
            perf/benchmark-report.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload benchmark report summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-summary
          path: perf/benchmark-report.md
          retention-days: 30

  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Run cargo test with coverage
        # 阈值：实测基线 21.49%（2026-09-08 首次真实 tarpaulin 运行），ratchet 只升不降；
        # 补测试后逐步上调。tarpaulin 无 branch 阈值参数（--fail-under-branches 直接报错），branches 维度以覆盖率报告人工跟踪
        run: cargo tarpaulin --workspace --out lcov --output-dir coverage/ --fail-under 21 -- --test-threads=2

      - name: Run cargo fmt check
        run: cargo fmt --check

      - name: Upload Rust coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: ./src-tauri/coverage/lcov.info
          flags: rust
          name: rust-coverage
          fail_ci_if_error: false

  dependency-vuln-scan:
    name: Dependency Vuln Scan
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: |
          # 临时使用官方 npm registry 进行 audit（npmmirror 不支持 audit 端点）
          # 按 security_gate.py 设计：pnpm audit 的退出码不作为门禁（pnpm 9 的 --audit-level
          # 只过滤输出、任何漏洞都会 exit 1），JSON 落盘后由棘轮基线判定 CRITICAL/HIGH 超标。
          pnpm audit --json --audit-level=critical --registry=https://registry.npmjs.org/ > "$GITHUB_WORKSPACE/pnpm-audit.json" || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        # 真实门禁：发现漏洞即阻断合并（退出码门禁）；JSON 落盘仓库根供棘轮基线比对
        # 按 security_gate.py 设计：cargo audit 退出码不作为门禁（yanked/ignored 均会影响退出码），
        # JSON 落盘后由棘轮基线判定。
        # cargo-audit 无 --manifest-path 参数（那是 cargo 的），用 -f 指定 Cargo.lock
        run: cargo audit --json -f src-tauri/Cargo.lock > cargo-audit.json || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute security gate (棘轮基线)
        shell: bash
        run: |
          python scripts/security_gate.py

      - name: Run osv-scanner
        # 扫描结果以报告形式落盘供人工审阅，退出码不作为门禁（security_gate.py 设计）
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            --recursive
            --skip-git
            ./

      - name: Upload osv-scanner report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osv-scanner-report
          path: |
            osv-report.json
            osv-report.html
          if-no-files-found: ignore
          retention-days: 14

  secret-scan:
    name: Secret Scanning (Trivy FS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (含完整历史)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy secret scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0 (SHA pin 防 tag 强更)
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          scanners: 'secret'
          scan-ref: '.'

  perf-stress:
    if: github.event_name == 'workflow_dispatch'
    name: Performance Stress Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start dev server
        run: |
          pnpm dev > /dev/null 2>&1 &
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:5223 > /dev/null 2>&1 && break
            sleep 1
          done
          curl -s http://127.0.0.1:5223 > /dev/null 2>&1 || (echo "Dev server failed to start" && exit 1)

      - name: Run memory leak test
        run: node perf/memory-leak-test.mjs
        continue-on-error: true

      - name: Run stress test
        run: node perf/stress-test.mjs
        continue-on-error: true

      - name: Upload performance stress results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-stress-results
          path: perf/results/
          if-no-files-found: ignore
          retention-days: 14

  build:
    if: github.event_name == 'workflow_dispatch'
    name: Build (${{ matrix.platform }})
    needs: [lint-and-test, rust-test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spiritpal-build-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/release/*.exe
            src-tauri/target/release/*.msi
          if-no-files-found: ignore
          retention-days: 14

  rust-clippy:
    name: Rust Clippy (Lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Run cargo clippy
        run: |
          set -o pipefail
          cargo clippy -- -D warnings 2>&1 | tee clippy.log

      - name: Upload clippy log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-log
          path: src-tauri/clippy.log

  # ============ 非门禁类工具链（workflow_dispatch / 每周 schedule，不阻塞 push） ============

  mutation-testing:
    name: Mutation Testing (Stryker)
    # P2-1：让 mutation score 有每周记录，不设门禁（mutate 面随 src/lib 结构演进）
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Stryker mutation testing
        run: npx stryker run

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 14

  flaky-detect:
    name: Flaky Test Detection
    # P2-2：每周对核心套件连跑 3 次识别 flaky，产出 perf/results/flaky-report.json
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run flaky detection (3 iterations)
        run: node scripts/flaky-detect.mjs 3

      - name: Upload flaky report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-report
          path: perf/results/flaky-report.json
          if-no-files-found: ignore
          retention-days: 14

  perf-memory-recall:
    name: Memory Recall Bench & Eval
    # P2-5：记忆召回基准+评估每周记录，趋势数据入库供看板消费
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run memory recall bench & eval
        run: pnpm perf:memory-recall

      - name: Upload memory recall results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-recall-results
          path: perf/results/
          if-no-files-found: ignore
          retention-days: 30
