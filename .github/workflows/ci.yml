name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  # 每周一 03:00 UTC 定期跑非门禁类工具链（flaky-detect / mutation / memory-recall）
  schedule:
    - cron: '0 3 * * 1'
  # 缺失本触发器时，下方 6 处 job 级 `if: ... == 'workflow_dispatch'`（137/368/420/547/586/623）
  # 恒为假：perf-baseline / perf-stress / build 永不执行，mutation / flaky / memory-recall 只能等周一。
  workflow_dispatch:

permissions:
  contents: read

# group 带 event_name 是有意的：否则周一 03:00 的 30 分钟 mutation 作业会被同期 push 取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and Test (Frontend, Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        # Node 20 已移除：仓库使用 pnpm 11（lockfile 与 pnpm/action-setup 均锁 11），
        # 而 pnpm 11 要求 Node >= 22.13 —— Node 20 上 `Install Node.js` 后 pnpm 直接
        # 报 `This version of pnpm requires at least Node.js v22.13` 并退出，
        # 该矩阵项结构性不可能通过（且 Node 20 已 EOL）。
        node-version: [22]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 字段统一驱动（pnpm@11.26.0），
        # 避免 action version 输入与 packageManager 双源冲突（ERR_PNPM_BAD_PM_VERSION）。

      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint (type check + ESLint)
        run: pnpm lint

      - name: Run frontend tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        # 双矩阵（Node 20/22）仅由 Node 22 上传一次，避免同 flag 互相覆盖
        if: always() && matrix.node-version == '22'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 14

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 字段统一驱动（pnpm@11.26.0），
        # 避免 action version 输入与 packageManager 双源冲突（ERR_PNPM_BAD_PM_VERSION）。

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start dev server
        run: |
          pnpm dev > /dev/null 2>&1 &
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:5223 > /dev/null 2>&1 && break
            sleep 1
          done
          curl -s http://127.0.0.1:5223 > /dev/null 2>&1 || (echo "Dev server failed to start" && exit 1)

      - name: Wait for app ready
        run: sleep 10

      - name: Run core E2E tests
        run: pnpm exec playwright test tests/e2e/app-loading.spec.ts tests/e2e/pet-interaction.spec.ts

      - name: Run accessibility tests
        run: pnpm exec playwright test tests/e2e/accessibility.spec.ts

      - name: Run system tests
        run: pnpm exec playwright test tests/e2e/memory-system.spec.ts tests/e2e/inventory-system.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test videos (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos
          path: test-results/screenshots/video/*.webm
          retention-days: 7

  perf-baseline:
    if: github.event_name == 'workflow_dispatch'
    name: Performance Baseline Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: spiritpal-build-ubuntu-22.04
          path: src-tauri/target/release/

      - name: Setup pnpm and Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run cold-start test
        run: node perf/cold-start.mjs
        env:
          SPIRITPAL_EXE: ./src-tauri/target/release/spiritpal-app
        continue-on-error: true

      - name: Run memory-usage test
        run: node perf/memory-usage.mjs
        env:
          SPIRITPAL_EXE: ./src-tauri/target/release/spiritpal-app
        continue-on-error: true

      - name: Run FPS test
        run: node perf/fps-test.mjs
        env:
          SPIRITPAL_EXE: ./src-tauri/target/release/spiritpal-app
        continue-on-error: true

      - name: Run model-switch-latency test
        run: node perf/model-switch-latency.mjs
        env:
          SPIRITPAL_EXE: ./src-tauri/target/release/spiritpal-app
        continue-on-error: true

      - name: Generate benchmark report
        run: node perf/benchmark-report.mjs
        continue-on-error: true

      # S5 硬门禁：对已入库基线做回归检查（perf/results/baseline.json），超 20% 回归即红。
      # 数据采集步骤容忍环境噪声（continue-on-error），本步骤不作宽限——性能基线下落必须有人过问。
      - name: Baseline regression gate
        run: node perf/baseline-trend.mjs --read-only
        env:
          SPIRITPAL_EXE: ./src-tauri/target/release/spiritpal-app

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-baseline-results
          path: |
            perf/results/
            perf/benchmark-report.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload benchmark report summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-summary
          path: perf/benchmark-report.md
          retention-days: 30

  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Create placeholder frontend dist
        # 同 rust-clippy：custom-protocol 使 generate_context! 编译期要求 frontendDist 存在，
        # 否则 cargo test 会因 proc macro panic 失败（本 job 不需要真实前端产物）。
        run: mkdir -p ../dist && printf '<!doctype html><title>ci-placeholder</title>\n' > ../dist/index.html

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Run cargo test with coverage
        # 阈值：实测基线 21.49%（2026-09-08 首次真实 tarpaulin 运行），ratchet 只升不降；
        # 补测试后逐步上调。tarpaulin 无 branch 阈值参数（--fail-under-branches 直接报错），branches 维度以覆盖率报告人工跟踪
        run: cargo tarpaulin --workspace --out lcov --output-dir coverage/ --fail-under 21 -- --test-threads=2

      - name: Run cargo fmt check
        run: cargo fmt --check

      - name: Upload Rust coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: ./src-tauri/coverage/lcov.info
          flags: rust
          name: rust-coverage
          fail_ci_if_error: false

  dependency-vuln-scan:
    name: Dependency Vuln Scan
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 字段统一驱动（pnpm@11.26.0），
        # 避免 action version 输入与 packageManager 双源冲突（ERR_PNPM_BAD_PM_VERSION）。

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: |
          # 临时使用官方 npm registry 进行 audit（npmmirror 不支持 audit 端点）
          # 按 security_gate.py 设计：pnpm audit 的退出码不作为门禁（pnpm 9 的 --audit-level
          # 只过滤输出、任何漏洞都会 exit 1），JSON 落盘后由棘轮基线判定 CRITICAL/HIGH 超标。
          pnpm audit --json --audit-level=critical --registry=https://registry.npmjs.org/ > "$GITHUB_WORKSPACE/pnpm-audit.json" || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        # 真实门禁：发现漏洞即阻断合并（退出码门禁）；JSON 落盘仓库根供棘轮基线比对
        # 按 security_gate.py 设计：cargo audit 退出码不作为门禁（yanked/ignored 均会影响退出码），
        # JSON 落盘后由棘轮基线判定。
        # cargo-audit 无 --manifest-path 参数（那是 cargo 的），用 -f 指定 Cargo.lock
        run: cargo audit --json -f src-tauri/Cargo.lock > cargo-audit.json || true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Execute security gate (棘轮基线)
        shell: bash
        run: |
          python scripts/security_gate.py

      # 防回归门禁（GOTCHAS #98）：每次 PR 校验 `tauri` 已启用 custom-protocol 特性，
      # 否则 release 不内嵌前端、双击 exe 会连 localhost:5223 失败。
      - name: Verify Tauri custom-protocol feature (embed gate)
        shell: bash
        run: python3 scripts/verify_tauri_embed.py --config-only || python scripts/verify_tauri_embed.py --config-only

      - name: Run osv-scanner
        # 扫描结果以报告形式落盘供人工审阅，退出码不作为门禁（security_gate.py 设计）
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@v2.6.0
        with:
          scan-args: |-
            --recursive
            --skip-git
            ./

      - name: Upload osv-scanner report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osv-scanner-report
          path: |
            osv-report.json
            osv-report.html
          if-no-files-found: ignore
          retention-days: 14

  secret-scan:
    name: Secret Scanning (Trivy FS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (含完整历史)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy secret scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0 (SHA pin 防 tag 强更)
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          scanners: 'secret'
          scan-ref: '.'

  perf-stress:
    if: github.event_name == 'workflow_dispatch'
    name: Performance Stress Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 字段统一驱动（pnpm@11.26.0），
        # 避免 action version 输入与 packageManager 双源冲突（ERR_PNPM_BAD_PM_VERSION）。

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start dev server
        run: |
          pnpm dev > /dev/null 2>&1 &
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:5223 > /dev/null 2>&1 && break
            sleep 1
          done
          curl -s http://127.0.0.1:5223 > /dev/null 2>&1 || (echo "Dev server failed to start" && exit 1)

      - name: Run memory leak test
        run: node perf/memory-leak-test.mjs
        continue-on-error: true

      - name: Run stress test
        run: node perf/stress-test.mjs
        continue-on-error: true

      - name: Upload performance stress results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-stress-results
          path: perf/results/
          if-no-files-found: ignore
          retention-days: 14

  build:
    if: github.event_name == 'workflow_dispatch'
    name: Build (${{ matrix.platform }})
    needs: [lint-and-test, rust-test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 字段统一驱动（pnpm@11.26.0），
        # 避免 action version 输入与 packageManager 双源冲突（ERR_PNPM_BAD_PM_VERSION）。

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # externalBin 预编：tauri.conf.json 声明 binaries/spiritpal-mcp，而仓库只提交占位脚本
      # （*.exe 被 .gitignore 排除，unix 目标亦无产物）→ 缺此步 windows 构建必失败：
      # `resource path binaries\spiritpal-mcp-x86_64-pc-windows-msvc.exe doesn't exist`。
      # triple 由 rustc -vV 的 host 行推导，不写死三个字符串（同 release.yml:59 的做法，但去掉了
      # 手工 arch 分支）。产物名与 tauri 查找规则 binaries/spiritpal-mcp-<triple>[.exe] 对齐。
      - name: Build sidecar (externalBin)
        shell: bash
        working-directory: src-tauri/mcp-server
        run: |
          set -euo pipefail
          cargo build --release
          triple=$(rustc -vV | sed -n 's/^host: //p')
          test -n "$triple" || { echo "rustc -vV 未给出 host triple"; exit 1; }
          ext=''
          case "$triple" in *windows*) ext='.exe' ;; esac
          mkdir -p ../binaries
          cp "target/release/spiritpal-mcp${ext}" "../binaries/spiritpal-mcp-${triple}${ext}"
          ls -l "../binaries/spiritpal-mcp-${triple}${ext}"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        # createUpdaterArtifacts=true + tauri.conf.json 已登记 updater.pubkey：
        # 缺私钥时 tauri 直接失败（ubuntu 实测 `A public key has been found, but no private key`）。
        # secret 名与 release.yml:113-114 一致；只引用，不读值、不打印。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}

      # 防回归门禁（GOTCHAS #98）：release 构建后校验主二进制真内嵌前端
      # （gzip 流数 + tauri://localhost + 体积），未内嵌即阻断。
      # 显式传路径：三平台主二进制同为 cargo 产物 target/release/spiritpal-app（macOS/Linux 无扩展名，
      # Windows 为 .exe），run 35976217476 里 macOS 腿就是因脚本只认 *.exe 而误报。
      - name: Verify release binary embeds frontend
        shell: bash
        run: |
          set -euo pipefail
          bin=src-tauri/target/release/spiritpal-app
          case "$RUNNER_OS" in
            Windows) bin="$bin.exe" ;;
          esac
          test -f "$bin" || { echo "[FAIL] 未找到主二进制 $bin"; exit 1; }
          # 只解析一次解释器：旧写法 python3 ... || python ... 会在真失败时把脚本跑两遍
          py=$(command -v python3 || command -v python)
          "$py" scripts/verify_tauri_embed.py "$bin"

      # R-11 构建期 SRI 门禁：重算 dist 产物 SHA-256 与 sri_hashes.rs 清单逐条比对，
      # 任何缺失/不一致即非零退出（防「清单登记与实际产物脱节」而运行时校验失去意义）。
      - name: Verify SRI manifest matches dist
        shell: bash
        run: node scripts/obfuscate-and-sri.mjs --verify

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spiritpal-build-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/release/*.exe
            src-tauri/target/release/*.msi
          if-no-files-found: ignore
          retention-days: 14

  rust-clippy:
    name: Rust Clippy (Lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Create placeholder frontend dist
        # tauri 启用 custom-protocol 特性后，generate_context! 会在**编译期**校验
        # frontendDist（../dist）存在，否则 proc macro panic：
        #   "The `frontendDist` configuration is set to \"../dist\" but this path doesn't exist"
        # 本 job 只跑 clippy，不消费真实前端资源，占位即可（真实构建见 build job）。
        run: mkdir -p ../dist && printf '<!doctype html><title>ci-placeholder</title>\n' > ../dist/index.html

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Run cargo clippy
        run: |
          set -o pipefail
          cargo clippy -- -D warnings 2>&1 | tee clippy.log

      - name: Upload clippy log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-log
          path: src-tauri/clippy.log
          retention-days: 7

  # ============ 非门禁类工具链（workflow_dispatch / 每周 schedule，不阻塞 push） ============

  mutation-testing:
    name: Mutation Testing (Stryker)
    # P2-1：让 mutation score 有每周记录，不设门禁（mutate 面随 src/lib 结构演进）
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # run 35976217476 实测：job 撞 30min 上限被 cancel（时长 1819s），当时 Stryker 进度 669/990。
    # 前 632 个只花约 5 分钟（大量 no-cov 突变体近乎零成本），其后 37 个用了 23 分钟≈37 s/个。
    # 剩余 321 个按后期速率约 3h19m（Stryker 自估 remaining ~3h34m）→ 全量首份基线约 4h。
    # 60min 必然再次超时，故取 240min；本 job 仅 dispatch/schedule、非门禁、public 仓 runner 不计费。
    timeout-minutes: 240

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 字段统一驱动（pnpm@11.26.0），
        # 避免 action version 输入与 packageManager 双源冲突（ERR_PNPM_BAD_PM_VERSION）。

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Stryker mutation testing
        # pnpm 的符号链接布局下 npx 解析 Stryker 插件会失败（runner pnpm 版本漂移加剧），
        # 改用 pnpm 自身调用以保证插件发现。
        run: pnpm stryker run

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 14

  flaky-detect:
    name: Flaky Test Detection
    # P2-2：每周对核心套件连跑 3 次识别 flaky，产出 perf/results/flaky-report.json
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 字段统一驱动（pnpm@11.26.0），
        # 避免 action version 输入与 packageManager 双源冲突（ERR_PNPM_BAD_PM_VERSION）。

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run flaky detection (3 iterations)
        run: node scripts/flaky-detect.mjs 3

      - name: Upload flaky report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-report
          path: perf/results/flaky-report.json
          if-no-files-found: ignore
          retention-days: 14

  perf-memory-recall:
    name: Memory Recall Bench & Eval
    # P2-5：记忆召回基准+评估每周记录，趋势数据入库供看板消费
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 字段统一驱动（pnpm@11.26.0），
        # 避免 action version 输入与 packageManager 双源冲突（ERR_PNPM_BAD_PM_VERSION）。

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run memory recall bench & eval
        run: pnpm perf:memory-recall

      - name: Upload memory recall results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-recall-results
          path: perf/results/
          if-no-files-found: ignore
          retention-days: 30
