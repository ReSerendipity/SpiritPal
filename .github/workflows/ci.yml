name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    name: Lint and Test (Frontend, Node ${{ matrix.node-version }})
    # T-23: 多 Node 版本测试矩阵
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint (type check + ESLint)
        run: pnpm lint

      - name: Run frontend tests with coverage
        run: pnpm test:coverage

      # T-12: Codecov 覆盖率集成 — 上传 lcov 报告至 Codecov 可视化平台
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 14

  e2e:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # T-09: 多浏览器 E2E — 安装 Chromium + Firefox + WebKit
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run E2E smoke tests
        run: pnpm test:e2e

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: playwright-report/
          retention-days: 14

  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # T-13: Rust 代码覆盖率收集 — cargo-tarpaulin
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Run cargo test with coverage
        # T-25: Rust 覆盖率硬性门禁 — 低于 50% 时 CI 失败
        run: cargo tarpaulin --workspace --out lcov --output-dir coverage/ --fail-under 50 -- --test-threads=2

      - name: Run cargo clippy
        run: cargo clippy -- -D warnings

      - name: Run cargo fmt check
        run: cargo fmt --check

      # T-12: Rust 覆盖率上传至 Codecov
      - name: Upload Rust coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./src-tauri/coverage/lcov.info
          flags: rust
          name: rust-coverage
          fail_ci_if_error: false

      # R-15 v2.0: cargo audit 已移至 dependency-vuln-scan job 集中管理

  # R-15 v2.0: 跨生态依赖漏洞扫描（pnpm audit + cargo audit + osv-scanner）
  # T-10: cargo audit 和 pnpm audit 已收紧 — 阻断合并
  dependency-vuln-scan:
    name: Dependency Vuln Scan (pnpm audit + cargo audit + osv-scanner)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # T-10: pnpm audit 收紧 — 阻断合并（高危及以上漏洞）
      - name: pnpm audit
        run: pnpm audit --audit-level=high

      # T-10: cargo audit 收紧 — 阻断合并
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

      # 3) osv-scanner — 阻断合并
      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.0
        with:
          scan-args: |-
            --recursive
            --skip-git
            ./

      - name: Upload osv-scanner report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osv-scanner-report
          path: |
            osv-report.json
            osv-report.html
          if-no-files-found: ignore
          retention-days: 14

  # R-16 v2.0: 密钥泄露扫描 — 学习 Image_MultiModel 的 Trivy FS 模式
  # 扫描仓库历史中的密钥/Token 泄露，防止凭据意外提交。
  secret-scan:
    name: Secret Scanning (Trivy FS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (含完整历史)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy secret scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          scanners: 'secret'
          scan-ref: '.'

  # T-26: 性能专项测试 — 内存泄漏和压力测试集成到 CI
  perf-stress:
    name: Performance Stress Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 安装 Playwright Chromium 用于性能测试脚本
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # 启动 dev server（后台运行）用于性能测试
      - name: Start dev server
        run: |
          pnpm dev &
          # 等待 dev server 启动
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:5223 > /dev/null 2>&1 && break
            sleep 1
          done
          curl -s http://127.0.0.1:5223 > /dev/null 2>&1 || (echo "Dev server failed to start" && exit 1)

      # 内存泄漏测试
      - name: Run memory leak test
        run: node perf/memory-leak-test.mjs
        continue-on-error: true

      # 压力测试
      - name: Run stress test
        run: node perf/stress-test.mjs
        continue-on-error: true

      - name: Upload performance stress results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-stress-results
          path: perf/results/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build (${{ matrix.platform }})
    # T-03: CI Job 依赖编排 — 构建前必须通过前端测试和 Rust 测试
    needs: [lint-and-test, rust-test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spiritpal-build-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/release/*.exe
            src-tauri/target/release/*.msi
          if-no-files-found: ignore
          retention-days: 14
