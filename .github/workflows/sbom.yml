# M-5: SBOM (Software Bill of Materials) 生成
# 每次发布标签时生成 CycloneDX 格式的 SBOM 并上传为 artifact

name: Generate SBOM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA pin 2026-11-06)

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (SHA pin 2026-11-06)
        # 版本由 package.json 的 packageManager 驱动（同 ci.yml:36-38）；
        # 显式 version 输入会与之冲突并被 action 拒绝。

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (SHA pin 2026-11-06)
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate npm SBOM (CycloneDX)
        # node_modules 是 pnpm 的隔离软链布局，`npm ls` 判它 ELSPROBLEMS 并以 1 退出（本地复现），
        # cyclonedx-npm 便中止。树其实读全了：加 flag 后产出 1893 component，故不是"绿而空"。
        run: |
          npx @cyclonedx/cyclonedx-npm --ignore-npm-errors --output-file sbom-npm.json --output-format json
          npx @cyclonedx/cyclonedx-npm --ignore-npm-errors --output-file sbom-npm.xml --output-format xml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (SHA pin 2026-11-06)

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate Rust SBOM (CycloneDX)
        working-directory: src-tauri
        # cargo-cyclonedx 0.5.9 移除了 --output-pattern（实测 exit 2 unexpected argument）；
        # 默认命名仍以 .cdx.json 结尾，下一步的 glob 不受影响。
        run: cargo cyclonedx --format json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (SHA pin 2026-11-06)
        with:
          name: sbom-cyclonedx
          path: |
            sbom-npm.json
            sbom-npm.xml
            src-tauri/*.cdx.json
          retention-days: 90

      # P2-2: SBOM 随发布 tag 附带进 GitHub Release（draft，与 release.yml 对齐），
      # 使发布资产包含完整依赖清单，避免 SBOM 只存在于 90 天后过期的 workflow artifact 中。
      - name: Attach SBOM to GitHub Release
        # workflow_dispatch 时 github.ref_name 是分支名而非 tag，此步必然失败；只在 tag 上执行
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3 (SHA pin 2026-11-06)
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            sbom-npm.json
            sbom-npm.xml
            src-tauri/*.cdx.json
