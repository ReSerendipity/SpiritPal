name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 报告外发现 #13：binaries/ 下 Windows .exe 被 .gitignore(*.exe) 排除，仓库仅有占位脚本，
      # CI Windows 构建因 externalBin 缺失必失败。改为构建前编译 MCP server 并放置到 binaries/（三平台）。
      - name: Build MCP server (externalBin)
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri/mcp-server
          cargo build --release
          mkdir -p ../binaries
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/spiritpal-mcp.exe "../binaries/spiritpal-mcp-x86_64-pc-windows-msvc.exe"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            if [ "$(uname -m)" = "arm64" ]; then
              cp target/release/spiritpal-mcp "../binaries/spiritpal-mcp-aarch64-apple-darwin"
            else
              cp target/release/spiritpal-mcp "../binaries/spiritpal-mcp-x86_64-apple-darwin"
            fi
          else
            cp target/release/spiritpal-mcp "../binaries/spiritpal-mcp-x86_64-unknown-linux-gnu"
          fi
          ls -la ../binaries/

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'SpiritPal v__VERSION__'
          releaseBody: |
            ## SpiritPal v__VERSION__

            ### Windows 用户：SmartScreen 提示说明（P1-2）
            安装包暂无 Authenticode 代码签名，Windows SmartScreen 的"已保护你的电脑"提示属于无签名软件的正常现象，并非病毒警告。请点击 **更多信息 → 仍然运行** 完成安装。本仓库绝不伪造或冒用任何证书，产物哈希可在 Release 资产中核对。

            ### 增量更新
            本版本已启用 Tauri 增量更新，应用内「检查更新」（托盘菜单 / 设置-关于）可自动下载并安装新版本。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # S3: 性能测试跨平台修复 — 在 Windows 上运行冷启动和内存测试（依赖 PowerShell）
  # FPS 和包大小测试在 Ubuntu 上运行（跨平台兼容）
  performance-test-windows:
    name: Performance Test (Windows - Cold Start & Memory)
    needs: release
    runs-on: windows-latest
    timeout-minutes: 30
    # T-08: 性能测试阻断发布 — 不再 continue-on-error

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: spiritpal-build-windows-latest
          path: ./artifacts

      # P1-01: 显式指向 release 产物，杜绝冷启动/内存门禁回退 dev 编译（测非发布产物）
      - name: Locate release binary
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path ./artifacts -Recurse -Filter '*.exe' -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -notmatch 'setup|install|uninst' } |
              Select-Object -First 1
          if ($exe) {
            echo "SPIRITPAL_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
            echo "使用 release 产物: $($exe.FullName)"
          } else {
            echo "::warning::未在 ./artifacts 找到 release exe，性能门禁将回退 dev 模式（结果失真）"
          }

      - name: Run cold-start and memory tests
        run: |
          pnpm perf:cold-start
          pnpm perf:memory

      # P1-02: 基线回归门禁 — 以仓库内 perf/results/baseline.json 为基准，
      # 任意指标劣化 >20% 即 exit(1)。首次运行无基线时自动成基并提示提交入库。
      - name: Baseline regression gate
        run: pnpm perf:baseline

      # P1-06: 性能门禁失败时清理本次 tag 对应的 draft release，避免草稿滞留
      - name: Cleanup failed draft release
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ github.ref_name }}" --yes --delete-tag 2>/dev/null || echo "::warning::草稿清理失败或不存在（${{ github.ref_name }}）"

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results-windows
          path: perf/results/
          if-no-files-found: ignore
          retention-days: 30

  performance-test-cross-platform:
    name: Performance Test (Ubuntu - FPS & Package Size)
    needs: release
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # T-08: 性能测试阻断发布 — 不再 continue-on-error

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install xvfb for GUI environment
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: spiritpal-build-ubuntu-22.04
          path: ./artifacts

      - name: Run FPS and package-size tests
        run: xvfb-run -a node perf/fps-test.mjs

      - name: Run package-size test
        run: node perf/package-size.mjs

      # P1-02: 只读回归比对（与 Windows job 的 baseline gate 互补；不写基线，避免跨 job 竞态）
      - name: Baseline regression gate (read-only)
        run: node perf/baseline-trend.mjs --read-only

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results-ubuntu
          path: perf/results/
          if-no-files-found: ignore
          retention-days: 30

  # P0-1.4 / P1-1: 发布后收尾 —— 回读验证资产完整性 + 生成并提交 updates.json
  # 漏更新 updates.json = 用户永远检查不到新版本（任务书避坑指南 #2），故放发布链路上强制同步。
  publish-updates:
    name: Publish updates.json & Verify Assets
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # P1-1 发布回读验证：资产数量齐全 + 签名文件存在（哈希比对见本地发布清单 docs/agents/RELEASE_VERIFICATION.md）
      - name: Verify release assets (count + signature presence)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          gh release view "$TAG" --json assets -q '.assets[].name' > /tmp/assets.txt
          echo "=== Release 资产清单 ($(wc -l < /tmp/assets.txt) 项) ==="
          cat /tmp/assets.txt
          # 硬性要求：Windows NSIS 安装包 + 更新器签名文件必须存在（增量更新入口）
          grep -qi "setup.exe" /tmp/assets.txt || { echo "::error::缺少 Windows NSIS 安装包资产"; exit 1; }
          grep -qi "\.sig" /tmp/assets.txt || { echo "::error::缺少更新器签名文件（createUpdaterArtifacts 未生效？）"; exit 1; }
          # 签名文件内容校验：minisign 格式（base64，以 untrusted comment 开头）
          SIG_NAME=$(grep -i "setup.exe.sig" /tmp/assets.txt | head -1)
          gh release download "$TAG" --pattern "${SIG_NAME}" --dir /tmp/sigcheck
          head -c 24 "/tmp/sigcheck/${SIG_NAME}" | base64 -d > /tmp/sighead 2>/dev/null || true
          grep -q "untrusted comment" /tmp/sighead 2>/dev/null || { echo "::error::签名文件格式异常（非 minisign）"; exit 1; }
          echo "✓ 签名文件校验通过"

      - name: Generate updates.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/generate-updates-json.mjs --repo "${{ github.repository }}" --tag "${{ github.ref_name }}"

      - name: Verify updates.json content
        run: |
          node -e "
            const u = require('./updates.json');
            if (!u.version || !u.platforms || Object.keys(u.platforms).length === 0) {
              console.error('updates.json 无效：缺 version/platforms'); process.exit(1);
            }
            for (const [k, v] of Object.entries(u.platforms)) {
              if (!v.url) { console.error(k + ' 缺 url'); process.exit(1); }
              if (!v.signature) { console.error(k + ' 缺 signature（客户端校验必然失败）'); process.exit(1); }
            }
            console.log('✓ updates.json 有效:', u.version, Object.keys(u.platforms).join(','));
          "

      - name: Commit and push updates.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.json
          if git diff --cached --quiet; then
            echo "updates.json 无变化，跳过提交"
          else
            git commit -m "chore(ci): sync updates.json for ${{ github.ref_name }} [skip ci]"
            git push origin main
          fi
