name: Release

# ## 两档触发（2026-10-29，v0.2.3 发版复盘）
# 1. **push tags v\*（完整发布链）**：构建三平台产物 → draft → 资产校验 → SHA256SUMS → updates.json 生成校验 → 转公开 → 开 updates.json 同步 PR。
# 2. **workflow_dispatch（收尾档 tail-only）**：以 `--ref main -f tag=<已存在的 tag>` 派发，**跳过两个构建 job**，只跑
#    `publish-updates`——用于完整链跑到「构建/上传」都成功、仅收尾步骤失败的场景（v0.2.3 实测：
#    ruleset `governance-baseline` 要求 main 必须走 PR 且 bot 不在 bypass 名单，直推 updates.json 被 GH013 拒）。
#    收尾档对已发布 release 各步骤均为幂等（edit --draft=false / SHA256SUMS --clobber），可安全重放。
#    注：workflow_dispatch 读取的是 --ref 处的本文件定义，旧 tag 提交上没有该触发器，故必须 --ref main；
#    目标 release 由 inputs.tag 指定（未填时回退 github.ref_name，push 场景不受影响）。
#
# ## 为什么 updates.json 从「直推 main」改为「开 PR」（2026-10-29）
# 原步骤 `git push origin HEAD:main` 用 GITHUB_TOKEN 直推，被 ruleset「Changes must be made through a pull
# request」拒绝（run 40881029744 末步实证；bypass 名单只有 Integration 29110）。改为本分支推
# `chore/updates-json-<tag>` + `gh pr create`，由 owner 审批合并——不改 ruleset（红线），人工动作收敛为
# 一次 approve + merge。合并前 Release 已公开、清单未入库的窗口是有意为之：清单校验在转公开之前完成，
# PR 只承载已验证内容。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    description: '收尾档：跳过构建，对 tag 输入指定的既有 release 重放发布链收尾（转公开 + updates.json PR）。须 --ref main'
    inputs:
      tag:
        description: '目标 release tag（如 v0.2.3）'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release (${{ matrix.platform }})
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 版本由 package.json 的 packageManager 字段统一驱动（pnpm@11.26.0），
      # 不能再传 version 输入，否则双源冲突 ERR_PNPM_BAD_PM_VERSION（与 ci.yml 同口径）。
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # 发布触发闸：本仓在用的协议检查点标签（v29-p1-1 … v29-p1-12 / v29-wb-start）与本 workflow 的
      # `on.push.tags: 'v*'` 共用同一命名空间，过去任何一枚检查点标签进入远端标签区就会跑完整三平台
      # 发布，并按 package.json 的 version 创建/公开一个与实际发版无关的 release。
      # 仓内已有同口径校验 .github/workflows/verify-release-version.yml，但它是独立 workflow，
      # 跨 workflow 无法 needs 阻断 release（只能并行变红），故发布链自身必须在任何创建动作前判一次。
      - name: Verify release tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG  package.json=v$PKG"
          if [ "v$PKG" != "$TAG" ]; then
            echo "::error::tag $TAG 与 package.json 版本 v$PKG 不一致——不是发版标签（协议检查点请用不匹配 v* 的命名）。已在任何 release 创建/上传动作之前终止。"
            exit 1
          fi
          echo "✓ 版本一致，继续发布：$TAG"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 报告外发现 #13：binaries/ 下 Windows .exe 被 .gitignore(*.exe) 排除，仓库仅有占位脚本，
      # CI Windows 构建因 externalBin 缺失必失败。改为构建前编译 MCP server 并放置到 binaries/（三平台）。
      - name: Build MCP server (externalBin)
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri/mcp-server
          cargo build --release
          mkdir -p ../binaries
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/spiritpal-mcp.exe "../binaries/spiritpal-mcp-x86_64-pc-windows-msvc.exe"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            if [ "$(uname -m)" = "arm64" ]; then
              cp target/release/spiritpal-mcp "../binaries/spiritpal-mcp-aarch64-apple-darwin"
            else
              cp target/release/spiritpal-mcp "../binaries/spiritpal-mcp-x86_64-apple-darwin"
            fi
          else
            cp target/release/spiritpal-mcp "../binaries/spiritpal-mcp-x86_64-unknown-linux-gnu"
          fi
          ls -la ../binaries/

      # tauri-action 在本仓库创建 release 持续 403（2026-09-10 实测 token 权限 OK：gh 创建 201），
      # 故预创建 draft（gh CLI + GITHUB_TOKEN），tauri-action 仅负责上传资产。
      # tauri-action 在本仓库创建 release 持续 403（2026-09-10 实测 token 权限 OK：gh 创建 201），
      # 故预创建 draft（gh CLI + GITHUB_TOKEN），tauri-action 仅负责上传资产。
      # tauri-action 在本仓库创建 release 持续 403（2026-09-10 实测 token 权限 OK：gh 创建 201），
      # 故预创建 draft（gh CLI + GITHUB_TOKEN），tauri-action 仅负责上传资产。
      - name: Ensure draft release exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "draft release exists, skip pre-create"
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          BODY="
          ## SpiritPal v$VERSION

          ### Windows 用户：SmartScreen 提示说明（P1-2）
          安装包暂无 Authenticode 代码签名，Windows SmartScreen 的“已保护你的电脑”提示属于无签名软件的正常现象，并非病毒警告。请点击 **更多信息 → 仍然运行** 完成安装。本仓库绝不伪造或冒用任何证书，产物哈希可在 Release 资产中核对。

          ### 增量更新
          本版本已启用 Tauri 增量更新，应用内「检查更新」（托盘菜单 / 设置-关于）可自动下载并安装新版本。
          "
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --title "SpiritPal v$VERSION" --draft --notes "$BODY"

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'SpiritPal v__VERSION__'
          releaseBody: |
            ## SpiritPal v__VERSION__

            ### Windows 用户：SmartScreen 提示说明（P1-2）
            安装包暂无 Authenticode 代码签名，Windows SmartScreen 的"已保护你的电脑"提示属于无签名软件的正常现象，并非病毒警告。请点击 **更多信息 → 仍然运行** 完成安装。本仓库绝不伪造或冒用任何证书，产物哈希可在 Release 资产中核对。

            ### 增量更新
            本版本已启用 Tauri 增量更新，应用内「检查更新」（托盘菜单 / 设置-关于）可自动下载并安装新版本。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # R-11 构建期 SRI 门禁：tauri-action 内 beforeBuildCommand 已生成清单，
      # 此处回读核对 dist 产物与 sri_hashes.rs 逐条一致，不一致即阻断发版。
      - name: Verify SRI manifest matches dist
        shell: bash
        run: node scripts/obfuscate-and-sri.mjs --verify

      # 2026-09-10：性能测试原设计下载 spiritpal-build-* artifact 但 release job 从未上传（报告外 #16）
      # 补传构建产物（release exe + bundle），使性能门禁可用。
      # 2026-10-29 修正：路径里的二进制名原先写成 SpiritPal / SpiritPal.exe，仓内没有任何产物叫这个名字
      # （真实名是 Cargo 包名 spiritpal-app，见 src-tauri/Cargo.toml 与 ci.yml 的同名上传步骤），
      # 于是这两行恒零匹配，exe 从未进过 artifact，只有 bundle/ 进得去，而 warn 不会声张。
      - name: Upload build artifacts (for perf gates)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spiritpal-build-${{ matrix.platform }}
          path: |
            src-tauri/target/release/spiritpal-app
            src-tauri/target/release/spiritpal-app.exe
            src-tauri/target/release/bundle/
          # 与 ci.yml 同口径用 error：bundle/ 三平台都有，聚合必非空，
          # 不会因某平台天然缺某个二进制名而误报；全零匹配时必须失败而不是静默"成功"。
          if-no-files-found: error
          retention-days: 7

  # 2026-09-10 用户指示：模型必须 N 卡。冷启动/内存/FPS 性能门禁依赖 N 卡 GPU 与交互桌面，
  # GitHub CI runner 不具备该条件（此前 Windows cold-start exit 1 / Ubuntu FPS exit 2 即此根因）。
  # 处置（降级并记录）：GPU 依赖步骤从 CI 移除，改为本地 N 卡机器人工验证（见 RELEASE_VERIFICATION.md）；
  # CI 保留无需 GPU 的可执行门禁：包大小 + 基线回归（只读）。
  performance-test-cross-platform:
    name: Package Size & Baseline Gate (Ubuntu)
    needs: release
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # T-08: 性能门禁（CI 可执行部分）阻断发布 — 不再 continue-on-error

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 同 release job：版本由 package.json 的 packageManager 驱动，不传 version 输入。
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # artifact 内含 bundle/（package-size.mjs 检查 src-tauri/target/release/bundle/）
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: spiritpal-build-ubuntu-22.04
          path: src-tauri/target/release

      - name: Run package-size test
        run: node perf/package-size.mjs

      # P1-02: 只读回归比对（不写基线，避免跨 job 竞态）
      # --allow-partial：cold-start/memory/fps 依赖 N 卡 GPU 桌面（T-08 已从 CI 移除，本地人工验证），
      # 本 runner 结构性采不到这三项；CI 可采集项只有 package-size（上一步已生成）。
      - name: Baseline regression gate (read-only)
        run: node perf/baseline-trend.mjs --read-only --allow-partial

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results-ubuntu
          path: perf/results/
          if-no-files-found: ignore
          retention-days: 30

  # P0-1.4 / P1-1: 发布后收尾 —— 回读验证资产完整性 + 生成并提交 updates.json
  # 漏更新 updates.json = 用户永远检查不到新版本（任务书避坑指南 #2），故放发布链路上强制同步。
  publish-updates:
    name: Publish updates.json & Verify Assets
    needs: [release]
    # 完整链：needs release 成功后执行；收尾档（workflow_dispatch）：release 被跳过，本 job 独立执行。
    # always() 前缀不可省：needs 上游被 skip 时，GitHub 会无条件级联跳过下游——纯布尔条件（哪怕
    # event_name 判真）也进不来（实测 run 40887581431 整 job skipped）。always() 解除级联后，
    # 括号内条件维持原闸门语义：push 链仍需 release 成功，构建失败时本 job 依旧不跑。
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # P1-1 发布回读验证：资产数量齐全 + 签名文件存在（哈希比对见本地发布清单 local/agents/RELEASE_VERIFICATION.md）
      - name: Verify release assets (count + signature presence)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          gh release view "$TAG" --json assets -q '.assets[].name' > /tmp/assets.txt
          echo "=== Release 资产清单 ($(wc -l < /tmp/assets.txt) 项) ==="
          cat /tmp/assets.txt
          # 硬性要求：Windows NSIS 安装包 + 更新器签名文件必须存在（增量更新入口）
          grep -qi "setup.exe" /tmp/assets.txt || { echo "::error::缺少 Windows NSIS 安装包资产"; exit 1; }
          grep -qi "\.sig" /tmp/assets.txt || { echo "::error::缺少更新器签名文件（createUpdaterArtifacts 未生效？）"; exit 1; }
          # 签名文件内容校验：minisign 格式（base64，以 untrusted comment 开头）
          SIG_NAME=$(grep -i "setup.exe.sig" /tmp/assets.txt | head -1)
          gh release download "$TAG" --pattern "${SIG_NAME}" --dir /tmp/sigcheck
          head -c 24 "/tmp/sigcheck/${SIG_NAME}" | base64 -d > /tmp/sighead 2>/dev/null || true
          grep -q "untrusted comment" /tmp/sighead 2>/dev/null || { echo "::error::签名文件格式异常（非 minisign）"; exit 1; }
          echo "✓ 签名文件校验通过"

      # §10.1 完整性要求：Release 资产须附 SHA256SUMS.txt（2026-10-20 修复 PR 补链，
      # 与 §10.6 已收敛 4 仓同口径）。此时 tauri-action 已把三平台产物全部上传进 draft Release，
      # 从 Release 下载全部资产生成校验清单并挂回，供下载侧核对防传输损坏。
      - name: Generate SHA256SUMS.txt and attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          rm -rf /tmp/sp-sha256 && mkdir -p /tmp/sp-sha256
          gh release download "$TAG" --dir /tmp/sp-sha256 --clobber
          cd /tmp/sp-sha256
          rm -f SHA256SUMS.txt        # 重跑发布链时覆盖旧清单自身，不重复累计
          sha256sum * > SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber --repo "${{ github.repository }}"
          echo "✓ SHA256SUMS.txt 已挂载（$(wc -l < SHA256SUMS.txt) 项）"

      # 顺序修正（Better Harness finding: release-goes-public-before-updates-manifest-verified）：
      # 原顺序是 转公开 → 生成 updates.json → 校验内容 → 提交推送，而本 job 上方 :202 的注释写明
      # 「漏更新 updates.json = 用户永远检查不到新版本，故放发布链路上强制同步」。生成/校验任一步失败时
      # release 已对用户可下载而清单仍是旧版本，且没有任何退回。
      # 现在把生成与校验前置：generate 走 gh release view（draft 可读，见 scripts/generate-updates-json.mjs:92
      # 的 2026-09-10 注记），不依赖公开发布；校验通过才转公开。
      - name: Generate updates.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/generate-updates-json.mjs --repo "${{ github.repository }}" --tag "${{ inputs.tag || github.ref_name }}"

      - name: Verify updates.json content
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node -e "
            const u = require('./updates.json');
            const tag = String(process.env.RELEASE_TAG || '').replace(/^v/, '');
            if (!u.version || !u.platforms || Object.keys(u.platforms).length === 0) {
              console.error('updates.json 无效：缺 version/platforms'); process.exit(1);
            }
            // 清单版本必须等于本次要公开的 tag：客户端读的是 raw main/updates.json，
            // version 落后于已发布 tag 时用户永远检查不到新版本（本仓 2026-10 就停过这个状态）。
            if (tag && u.version !== tag) {
              console.error('updates.json 的 version=' + u.version + ' 与本次发布 tag=' + tag + ' 不一致');
              process.exit(1);
            }
            for (const [k, v] of Object.entries(u.platforms)) {
              if (!v.url) { console.error(k + ' 缺 url'); process.exit(1); }
              if (!v.signature) { console.error(k + ' 缺 signature（客户端校验必然失败）'); process.exit(1); }
            }
            console.log('✓ updates.json 有效:', u.version, Object.keys(u.platforms).join(','));
          "

      - name: Publish draft release (draft=false)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "${{ inputs.tag || github.ref_name }}" --repo "${{ github.repository }}" --draft=false
          echo "::notice::draft 已转正式 release：${{ inputs.tag || github.ref_name }}（updates.json 已先于此校验通过）"

      - name: Commit updates.json and open sync PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          BRANCH="chore/updates-json-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.json
          if git diff --cached --quiet; then
            echo "updates.json 与 ${TAG} 生成结果无差异，跳过提交"
            exit 0
          fi
          # 仅 pub_date 变化（清单内容 version/url/signature 全同）时不制造空转 PR——
          # 收尾档重放已同步过的 release 时会命中此分支。
          if ! git diff --cached -U0 -- updates.json | grep -E '^[+-][^+-]' | grep -v '"pub_date"' | grep -q .; then
            echo "updates.json 仅 pub_date 变化，内容无实质差异，跳过提交"
            git checkout -- updates.json
            exit 0
          fi
          # checkout 在 --ref（main）上。ruleset 要求 main 必须走 PR（bot 无 bypass），
          # 故推到独立分支并开 PR；不带 [skip ci]——PR 需要跑齐 ruleset 的必需检查才能合并。
          # commit -s 满足 DCO 必需检查（trailer 与 bot 作者身份一致）。
          git checkout -b "$BRANCH"
          git commit -s -m "chore(ci): sync updates.json for ${TAG}"
          git push origin "$BRANCH"
          if [ -n "$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" --state open --json number -q '.[0].number // empty')" ]; then
            echo "PR 已存在（head=$BRANCH），跳过创建"
          else
            gh pr create --repo "${{ github.repository }}" --base main --head "$BRANCH" \
              --title "chore(ci): sync updates.json for ${TAG}" \
              --body "发布链 ${TAG} 收尾自动同步更新清单。Release 已按链序完成资产校验与转公开，本 PR 仅承载已验证的 updates.json。ruleset 禁止 bot 直推 main，请审批合并。"
          fi

      # 失败侧收口：公开发布之后的任一步失败时，把该 release 退回 draft，避免留下
      # 「用户可下载但更新清单没跟上」的半完成态。
      # 仅限 push 完整链：收尾档（workflow_dispatch）面对的 release 往往在派发前就已公开
      # （v0.2.3 场景），退回 draft 会把用户正在用的版本下线，属反向破坏，不做。
      - name: Re-draft release if a post-publication step failed
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          STATE=$(gh release view "${{ inputs.tag || github.ref_name }}" --repo "${{ github.repository }}" --json isDraft -q '.isDraft' 2>/dev/null || echo unknown)
          echo "当前 isDraft=$STATE"
          if [ "$STATE" = "false" ]; then
            gh release edit "${{ inputs.tag || github.ref_name }}" --repo "${{ github.repository }}" --draft=true
            echo "::error::发布链后半段失败，已把 ${{ inputs.tag || github.ref_name }} 退回 draft；在 updates.json 同步成功前不要让该版本对外可见"
          else
            echo "该 release 未处于公开态（或不存在），无需退回"
          fi
