name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'SpiritPal v__VERSION__'
          releaseBody: 'See the assets below to download this version.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # S3: 性能测试跨平台修复 — 在 Windows 上运行冷启动和内存测试（依赖 PowerShell）
  # FPS 和包大小测试在 Ubuntu 上运行（跨平台兼容）
  performance-test-windows:
    name: Performance Test (Windows - Cold Start & Memory)
    needs: release
    runs-on: windows-latest
    # T-08: 性能测试阻断发布 — 不再 continue-on-error

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: spiritpal-build-windows-latest
          path: ./artifacts

      - name: Run cold-start and memory tests
        run: |
          pnpm perf:cold-start
          pnpm perf:memory

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results-windows
          path: perf/results/
          if-no-files-found: ignore
          retention-days: 30

  performance-test-cross-platform:
    name: Performance Test (Ubuntu - FPS & Package Size)
    needs: release
    runs-on: ubuntu-22.04
    # T-08: 性能测试阻断发布 — 不再 continue-on-error

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install xvfb for GUI environment
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: spiritpal-build-ubuntu-22.04
          path: ./artifacts

      - name: Run FPS and package-size tests
        run: xvfb-run -a node perf/fps-test.mjs

      - name: Run package-size test
        run: node perf/package-size.mjs

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results-ubuntu
          path: perf/results/
          if-no-files-found: ignore
          retention-days: 30
