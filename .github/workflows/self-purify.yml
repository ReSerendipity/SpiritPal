name: Self-Purify Check

# 家族「自净化」检查入口（2026-09-10 建立）。
# 复用 ReSerendipity/.github 的 self-purify.yml；非阻塞由 org reusable 的
# job 级 continue-on-error 实现（GitHub 不允许 uses job 携带 continue-on-error），
# 违规详情见该 job 的 ::error 注解。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周一 02:00 UTC（北京时间 10:00）例行巡检
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-purify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-purify:
    name: 自净化检查（非阻塞）
    uses: ReSerendipity/.github/.github/workflows/self-purify.yml@051227229483b9efe65f57a6a81ddcd10cf950fc # pinned 2026-10-22
    with:
      # 仓级豁免（2026-10-20）：docs/execution/ 为本仓公开层归档处——LOCAL_RULES.md 第 4 条
      # （2026-10-17 更正）明确执行记录与证据截图归公开层并纳入版本控制，故不按「本地治理文档」判违规。
      # 见 docs/execution/ 内 41 个已跟踪文件（8 篇 md + 30 张证据 png + 3 篇白名单内文档）。
      extra_exempt_regex: '^docs/execution/'
