# T-07: SAST 工具集成 — CodeQL 静态安全分析
# 对 JavaScript/TypeScript 和 Rust 代码进行静态安全分析
name: CodeQL Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # 每周一 00:00 UTC 定期扫描
    - cron: '0 0 * * 1'

jobs:
  analyze:
    # 原本 `!= 'push'` 一刀切，导致 43 次 push 到 main 全部 skipped：
    # main 的告警态只能靠每周一次的 cron 刷新（历史仅 2026-09-14 跑过一次）。
    # 现改为「非 push 一律跑；push 只在 main 上跑」——特性分支的 push 仍跳过，
    # 由它自己的 PR 扫描覆盖，不额外增加分钟数。
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    name: CodeQL Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'rust']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain (for CodeQL Rust analysis)
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # 注意：init@v3 的 `config` 输入要的是 YAML **内容本身**，不是文件路径。
          # 传路径会被当成标量字符串，报 `Cannot create property 'queries' on
          # string '.github/codeql/config.yml'`（#76 首版实测踩到，两个语言全挂）。
          # 套件必须走 config 才能按路径分组：行内 `queries:` 输入不支持分组。
          config: |
            name: SpiritPal SAST
            queries:
              # 发布代码：完整套件，零豁免。
              - name: shipped (full security-and-quality)
                exclude-paths:
                  - src-tauri/tests/**
                queries:
                  - uses: security-and-quality
              # 纯测试目录：摘掉 rust/hard-coded-cryptographic-value。
              # 依据（2026-09-20 逐条核对）：该规则 88 条 open 告警中 33 条落在
              # src-tauri/tests/test_crypto.rs，全是加密测试的口令/盐/IV/期望值，
              # 真实可修问题 0 条。写在 src-tauri/src/** 文件**内部**的
              # #[cfg(test)]（crypto.rs 39 条、lib.rs 13 条）按路径排除不掉，
              # 连同生产代码 3 条零初始化缓冲，共 55 条走逐条 dismiss 绑定理由。
              - name: tests (minus hard-coded-crypto false positives)
                paths:
                  - src-tauri/tests/**
                queries:
                  - uses: security-and-quality
                    exclude:
                      - rust/hard-coded-cryptographic-value

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
