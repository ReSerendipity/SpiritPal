# T-07: SAST 工具集成 — CodeQL 静态安全分析
# 对 JavaScript/TypeScript 和 Rust 代码进行静态安全分析
name: CodeQL Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # 每周一 00:00 UTC 定期扫描
    - cron: '0 0 * * 1'

jobs:
  analyze:
    # 原本 `!= 'push'` 一刀切，导致 43 次 push 到 main 全部 skipped：
    # main 的告警态只能靠每周一次的 cron 刷新（历史上仅 2026-09-14 跑过一次，
    # 此后 6 天没更新）—— 这才是 204 条 open 告警不收敛的机制性原因。
    # 现改为「非 push 一律跑；push 只在 main 上跑」。特性分支的 push 仍跳过，
    # 由它自己的 PR 扫描覆盖，不额外增加 Actions 分钟数。
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    name: CodeQL Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'rust']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain (for CodeQL Rust analysis)
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # 使用 security-and-quality 查询套件，包含安全 + 代码质量
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
