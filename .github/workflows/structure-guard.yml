name: structure-guard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check repository root layout
        run: python .github/scripts/check_layout.py
      - name: Check spec references (if present)
        run: |
          if [ -f scripts/check_spec_refs.py ]; then
            python scripts/check_spec_refs.py
          else
            echo "scripts/check_spec_refs.py not present; skipping"
          fi
      # P2-1: capability 最小授权 lint（报告2 §二；负向测试见 scripts/__tests__/lint-capabilities.test.mjs）
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capability minimal-permission lint
        run: node scripts/lint-capabilities.mjs
      # 跟踪机制 §机制四：执行文档（docs/execution）被家族 self-purify 机制移出跟踪过
      # （e2a9699，经用户授权恢复 3578975）。本门禁把「再次被移出」显式化为 CI 红，
      # 防止静默丢失；再犯时按应急预案走治理层裁决，不在 CI 层对抗。
      - name: Execution docs tracked guard
        run: node scripts/check-exec-docs-tracked.mjs
