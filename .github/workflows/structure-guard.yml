name: structure-guard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check repository root layout
        run: python .github/scripts/check_layout.py
      - name: Audit spec references
        # 与 docs-consistency.yml 统一守卫风格：单条直调 + --allow-unavailable；
        # 不再有 workflow 侧第二套 if [ -f ] 跳过逻辑——审计器缺失由包装脚本
        # 输出 UNAVAILABLE 并由 CI 显式 ::warning:: 标注（绿 ≠ 已验证）。
        run: python scripts/check_spec_refs.py --allow-unavailable
      # P2-1: capability 最小授权 lint（报告2 §二；负向测试见 scripts/__tests__/lint-capabilities.test.mjs）
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capability minimal-permission lint
        run: node scripts/lint-capabilities.mjs
      # 负向测试接线（2026-10-06 补）：上面那条正向 lint 只能证明「现在的配置没违规」，
      # 证明不了「它会拦违规」——门禁自证能力此前仅存于上方「P2-1: capability 最小授权 lint」
      # 注释里的文件引用，无任何执行点（vitest.config.ts 把它显式 exclude，pnpm test 不跑它）。
      # 该测试用 node:test API（同目录另两个 .test.mjs 用 vitest API），跑在 vitest 下会因
      # 找不到 describe/it 而失败，故仍保持该 exclude；唯一的调用方式就是
      # `node --test <file>`（其 docstring 自述），不依赖 pnpm install 与任何 npm 脚本。
      # 它断言注入 sql/shell:allow-execute、*://* scope、未注册 invoke 时脚本必须 exit 1
      # ——脚本被改哑（或黑名单被删）即红灯。已实测：6/6 用例 rc=0；往
      # src-tauri/capabilities/default.json 注入 shell:allow-execute 后本步 rc=1 且点名违规项。
      - name: Capability lint negative self-test
        run: node --test scripts/__tests__/lint-capabilities.test.mjs
      # 跟踪机制 §机制四：执行文档（docs/execution）被家族 self-purify 机制移出跟踪过
      # （e2a9699，经用户授权恢复 3578975）。本门禁把「再次被移出」显式化为 CI 红，
      # 防止静默丢失；再犯时按应急预案走治理层裁决，不在 CI 层对抗。
      - name: Execution docs tracked guard
        run: node scripts/check-exec-docs-tracked.mjs
      # Android release JNI keep 守卫（GOTCHAS #121/#122）：release 开 minifyEnabled 后，
      # R8 会把「Kotlin/Java 侧无调用者、只能被 Rust 侧经 JNI 反射调用」的方法当 unused
      # 整方法删除 —— 编译期零告警、打包零报错，真机启动才抛 NoSuchMethodError（已踩 3 次：
      # WryActivity.getId / TauriActivity.getPluginManager / RustWebView.clearAllBrowsingData+getCookies）。
      # 此处静态校验：keep 规则是否覆盖全部「仅 JNI 可达」方法 + build.gradle 是否仍引用规则
      # 文件 + wry/tauri 版本是否仍是已审计版本（依赖升级会改变 JNI 面）。无需 Android 工具链。
      # DEX 级证明（APK 里真有这些方法）需 APK，见 scripts/verify_android_jni_keeps.py，release 包出完必跑（SOP-4）。
      - name: Android JNI keep guard
        run: python scripts/check_android_proguard_keeps.py
