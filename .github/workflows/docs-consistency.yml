name: Docs Consistency
on:
  pull_request:
    paths: ['**/*.md', '.pre-commit-config.yaml', 'package.json', '.github/workflows/**']
  push:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Audit spec references
        # 家族审计器位于仓库外（同级 .spec_audit），干净 CI 检出必然缺失：
        # --allow-unavailable 把「未执行」转为显式 ::warning:: 标注 + step summary；
        # 绿色 job ≠ 已验证（状态契约见 scripts/check_spec_refs.py docstring）。
        run: python scripts/check_spec_refs.py --allow-unavailable

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify version consistency (package.json / Cargo.toml / tauri.conf.json)
        run: node scripts/sync-version.mjs --check
