name: Docs Consistency
on:
  pull_request:
    paths: ['**/*.md', '.pre-commit-config.yaml', 'package.json', '.github/workflows/**']
  push:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA pin 2026-11-06)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7 (SHA pin 2026-11-06)
        with:
          python-version: '3.12'
      - name: Audit spec references
        # 家族审计器位于仓库外，干净 CI 检出永远跑不到它；旧写法靠 --allow-unavailable
        # 把「未执行」翻成绿色 job（2026-10-14 去掉，见 GOTCHAS #123 同源问题）。
        # 包装脚本现在回落仓内 scripts/spec_audit_local.py，本步骤真的会读工作流/
        # package.json/pre-commit 里被调用的脚本路径与治理文档里的仓库路径并判定存在性；
        # 状态行 auditor=repo-local 说明跑的是仓内审计，family 说明本机有家族审计器。
        run: python scripts/check_spec_refs.py

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA pin 2026-11-06)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (SHA pin 2026-11-06)
        with:
          node-version: 22
      - name: Verify version consistency (package.json / Cargo.toml / tauri.conf.json)
        run: node scripts/sync-version.mjs --check
