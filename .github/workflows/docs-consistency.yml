name: Docs Consistency
on:
  pull_request:
    paths: ['**/*.md', '.pre-commit-config.yaml', 'package.json', '.github/workflows/**']
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  spec-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Audit spec references
        run: python scripts/check_spec_refs.py

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify version consistency (package.json / Cargo.toml / tauri.conf.json)
        run: node scripts/sync-version.mjs --check
