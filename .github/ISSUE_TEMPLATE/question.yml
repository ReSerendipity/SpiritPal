name: 提问
description: 咨询 SpiritPal 的安装、配置或使用问题
title: "[QUESTION] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的提问！请尽量描述清楚问题背景，方便社区协助解答。

  - type: textarea
    id: question
    attributes:
      label: 你的问题
      description: 清晰描述你的问题
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 背景 / 想达成的目标
      description: 你在做什么？想要达到什么效果？
    validations:
      required: false

  - type: textarea
    id: tried
    attributes:
      label: 已尝试的方法
      description: 你已经尝试过哪些步骤？
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: 设备系统
      options:
        - Android 11
        - Android 12
        - Android 13
        - Android 14
        - Android 15+
        - 其他
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: App 版本
      description: 应用内"关于"页或 Release 页面中的版本号
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 还有其他需要说明的吗？
    validations:
      required: false