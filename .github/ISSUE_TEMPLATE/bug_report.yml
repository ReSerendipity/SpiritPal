name: Bug 报告
description: 提交一个 Bug 报告帮助我们改进 SpiritPal
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提交 Bug 报告！请尽可能详细地填写以下信息，这能帮助我们快速定位问题。
        Android 项目的 Bug 往往和设备/系统版本相关，请务必填写环境信息。

  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 简要描述你遇到的问题
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 详细描述如何复现这个问题
      placeholder: |
        1. 打开 App（版本 v...）
        2. 进入 '...' 页面
        3. 执行 '...' 操作
        4. 出现错误
      render: markdown
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / 录屏
      description: 粘贴截图或录屏，越详细越好
      placeholder: |
        ```
        拖拽或粘贴截图到这里
        ```
      render: markdown
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Android 11
        - Android 12
        - Android 13
        - Android 14
        - Android 15+
        - 其他
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备型号
      description: 例如：小米 14 / 三星 S24 / Pixel 8
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: App 版本
      description: 应用内"关于"页或 Release 页面中的版本号
      placeholder: "例如：2.0.0"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 若有崩溃日志或 adb logcat 片段，粘贴到这里
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 还有其他需要说明的吗？
    validations:
      required: false