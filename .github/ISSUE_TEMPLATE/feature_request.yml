name: 💡 功能建议
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述你希望 SpiritPal 新增或改进的功能。

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 你遇到了什么不便？当前功能有什么不足？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望怎么解决？描述理想的功能行为
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他替代方案

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      description: 对你来说这个功能有多重要？
      options:
        - 锦上添花（有更好，没有也行）
        - 期望尽快有（影响使用体验）
        - 非常需要（当前严重影响使用）
    validations:
      required: true
