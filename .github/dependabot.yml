version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: "/src-tauri/gen/android"
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
  - package-ecosystem: pip
    directory: "/src-tauri/memory_sidecar"
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
