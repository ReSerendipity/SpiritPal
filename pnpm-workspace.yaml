packages: []
allowBuilds:
  edgedriver: true
  esbuild: true
  geckodriver: true
  protobufjs: true
  sharp: true
overrides:
  gh-pages: ">=5.0.0"
  protobufjs: ">=7.5.5"
  sharp: ">=0.35.4"
  js-yaml: ">=4.3.2"
  # 依赖漏洞修复（2026-10-02 人工#4）：底座从 >=3.1.6 抬到 >=4.1.5。
  # 旧底座只挡得住 2026-09 那批公告——它按"任意 major 取最高"解析，如今把 4.1.4
  # 放进来仍是漏洞版本（GHSA-hrr3-gc8f-f4qj / GHSA-jvvf-x445-j334，均首修 4.1.5）。
  # 父包 ajv@8.20.0 声明的是 ^3.0.1，修复版只能靠 override 抬，不能靠 update 解。
  fast-uri: ">=4.1.5"
  ini: ">=1.3.6"
  nanoid: ">=3.3.18"
  semver: ">=6.3.1"
  # 依赖漏洞修复（2026-09-10 人工#2）：hono/qs 生产链（MCP SDK→express→qs、MCP SDK→hono）
  hono: ">=4.13.5"
  qs: ">=6.16.0"
  # 依赖漏洞修复（2026-09-29 人工#3，GHSA-2vr4-cq9g-pvrc / CVE-2026-101910）：
  # ip-address 未识别 NAT64 本地用段 64:ff9b:1::/48，可绕 SSRF/信任边界；首修 10.5.1。
  # 引入链 @modelcontextprotocol/sdk → express-rate-limit → ip-address，仅 SDK 的 OAuth
  # auth handler 用到；本仓只用 stdio/sse 传输，运行时不加载该路径。同包另 5 条公告
  # 的漏洞上限均 <=10.5.0，故 >=10.5.1 一并清零。
  ip-address: ">=10.5.1"
  # 依赖漏洞修复（2026-10-02 人工#4，GHSA-qhr7-859c-m2p7 / GHSA-6j4f-fj2g-mc7p high、
  # GHSA-q2hr-2g5m-vwhr moderate）：brace-expansion 通配符展开可被构造出指数级内存/耗时。
  # **此处刻意不加 override**：锁里三份 brace-expansion（1.1.18 / 2.1.4 / 5.0.9）的父包
  # 只有 minimatch@3.1.5（^1.1.7）、@9.0.9（^2.0.2）、@10.2.6（^5.0.8），声明区间本就
  # 容纳修复版 1.1.21 / 2.1.7 / 5.0.12 ⇒ 属"解析陈旧"，用
  # `pnpm update brace-expansion --lockfile-only` 就地解新，净差异只有这三条版本线。
  # 一条全局 `brace-expansion: ">=1.1.21"` 反而会按"任意 major 取最高"把 1.x/2.x 消费者
  # 一起顶到 5.x（minimatch@3 直接用错 API），所以这里只需要锁文件、不需要底座。
